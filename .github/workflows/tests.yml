name: Backend tests

# The desktop build workflow packages the app but historically ran ZERO
# tests — a teaching tool could ship wrong answers without anything
# noticing. This job runs the analytical validation suite on every push.
on:
  push:
    branches: [master, main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the app's real requirements plus the declared test-only
          # deps. (A hand-maintained subset here previously omitted the
          # runtime deps mapclassify and openpyxl, failing 3 tests on a
          # green codebase.)
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend validation suite
        working-directory: backend
        run: python -m pytest tests/ -q
