name: Build Cartolith Desktop App

# Builds native double-click apps for Windows, macOS, and Linux on every
# push to main, and attaches them to a GitHub Release when you push a
# version tag like "v1.0". This is what does the cross-platform building
# your own machine / this sandbox can't -- each OS builds its own binary
# on its own real runner.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Cartolith-windows
          - os: macos-latest
            artifact_name: Cartolith-macos
          - os: ubuntu-latest
            artifact_name: Cartolith-linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 gir1.2-gtk-3.0 libgirepository1.0-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r desktop/requirements-desktop.txt

      - name: Run PyInstaller
        working-directory: desktop
        run: pyinstaller cartolith.spec --noconfirm

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: desktop/dist
        run: zip -r ${{ matrix.artifact_name }}.zip Cartolith.app

      - name: Zip Windows/Linux folder
        if: runner.os != 'macOS'
        shell: bash
        working-directory: desktop/dist
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path Cartolith -DestinationPath ${{ matrix.artifact_name }}.zip"
          else
            zip -r ${{ matrix.artifact_name }}.zip Cartolith
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/${{ matrix.artifact_name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/${{ matrix.artifact_name }}.zip
